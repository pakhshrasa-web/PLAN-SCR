name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.12'
    
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential git zip unzip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev wget ccache \
          libfreetype6-dev libjpeg-dev gcc g++ \
          libfreetype6
    
    - name: Install p4a and cython
      run: |
        pip install --upgrade pip setuptools wheel
        pip install python-for-android cython==0.29.37
    
    - name: Clean ALL previous builds
      run: |
        rm -rf ~/.buildozer
        rm -rf ~/.local/share/python-for-android
        rm -rf .buildozer
        rm -rf bin
        mkdir -p data fonts
        echo "CC=gcc" >> $GITHUB_ENV
        echo "CXX=g++" >> $GITHUB_ENV
    
    - name: Download NDK r25b and SDK
      run: |
        echo "=== Downloading NDK r25b ==="
        mkdir -p ~/.android
        cd ~/.android
        
        # دانلود NDK r25b
        wget -q --tries=3 --timeout=60 \
          "https://dl.google.com/android/repository/android-ndk-r25b-linux.zip" \
          -O ndk.zip
        
        unzip -q ndk.zip
        rm ndk.zip
        
        echo "=== Downloading Android SDK ==="
        mkdir -p ~/.android/sdk
        cd ~/.android/sdk
        
        # دانلود command line tools
        wget -q --tries=3 --timeout=60 \
          "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" \
          -O cmdtools.zip
        
        unzip -q cmdtools.zip
        rm cmdtools.zip
        
        # Accept licenses
        yes | ~/.android/sdk/cmdline-tools/bin/sdkmanager --licenses > /dev/null 2>&1 || true
        
        # Install platform 33
        ~/.android/sdk/cmdline-tools/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2" > /dev/null 2>&1 || true
        
        echo "=== NDK and SDK ready ==="
        ls -la ~/.android/
    
    - name: Download freetype from multiple sources
      run: |
        echo "=== Downloading freetype ==="
        mkdir -p ~/.cache/p4a/freetype
        
        # تلاش از GitHub
        wget --tries=3 --timeout=60 \
          "https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz" \
          -O ~/.cache/p4a/freetype/freetype-2.14.1.tar.gz \
        || wget --tries=3 --timeout=60 \
          "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz" \
          -O ~/.cache/p4a/freetype/freetype-2.14.1.tar.gz \
        || wget --tries=3 --timeout=60 \
          "https://ftp.osuosl.org/pub/blfs/conglomeration/freetype/freetype-2.14.1.tar.gz" \
          -O ~/.cache/p4a/freetype/freetype-2.14.1.tar.gz
        
        echo "=== Freetype downloaded ==="
        ls -la ~/.cache/p4a/freetype/
    
    - name: Build APK with p4a directly
      run: |
        echo "=== Starting p4a build ==="
        
        # ساخت APK با p4a
        p4a apk \
          --private . \
          --package org.pakhshrasa.planandroid \
          --name "Plan Android" \
          --version 0.1.1 \
          --bootstrap sdl2 \
          --requirements "python3,kivy==2.3.0,Pillow==10.4.0,openpyxl,arabic-reshaper,python-bidi,jdatetime" \
          --arch arm64-v8a \
          --sdk-dir $HOME/.android/sdk \
          --ndk-dir $HOME/.android/android-ndk-r25b \
          --android-api 33 \
          --ndk-api 21 \
          --release \
          --sign \
          --copy-libs \
          2>&1 | tee build.log
      env:
        CC: gcc
        CXX: g++
        ANDROIDSDK: "$HOME/.android/sdk"
        ANDROIDNDK: "$HOME/.android/android-ndk-r25b"
        ANDROIDAPI: "33"
        ANDROIDMINAPI: "21"
    
    - name: Check APK
      run: |
        echo "=== Checking APK ==="
        find . -name "*.apk" -type f 2>/dev/null
        ls -la *.apk 2>/dev/null || echo "No APK in current directory"
        ls -la bin/ 2>/dev/null || echo "No bin directory"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: |
          *.apk
          bin/*.apk
        if-no-files-found: warn
    
    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        if-no-files-found: warn
