name: Build Android APK with Docker

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create data files
      run: |
        mkdir -p data
        echo '{"agents": [], "routes": [], "customers": []}' > data/definitions.json
        echo '{"supervision_rate": 0.3, "conversion_rate": 0.25, "avg_invoice_amount": 1000000, "target_amount": 50000000, "target_count": 100, "target_invoice_count": 20, "target_customer_count": 50, "target_new_customer_count": 10, "target_cash_sales": 30000000, "target_credit_sales": 20000000, "work_start_time": "08:00", "first_visit_time": "09:00", "min_daily_hours": 6, "first_customer_of_route": ""}' > data/settings.json
        echo '{"users": []}' > data/users.json
        echo '{"codes": []}' > data/codes.json
        echo '{"hashed_password": ""}' > data/admin_password.json
        echo '{}' > data/daily_log.json

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Plan Android
        package.name = planandroid
        package.domain = org.pakhshrasa
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ttf,json
        version = 1.0.${env:GITHUB_RUN_NUMBER}
        requirements = python3,kivy,openpyxl,arabic-reshaper,python-bidi,Pillow,jdatetime
        orientation = portrait
        fullscreen = 1
        icon.filename = icon/kivy-icon-512.png
        presplash.filename = icon/kivy-icon-512.png
        
        [buildozer]
        log_level = 2
        warn_on_root = 1
        
        [buildozer:android]
        android.api = 34
        android.minapi = 21
        android.ndk = 25b
        android.sdk_path = /home/user/.buildozer/android/platform/android-sdk
        android.accept_sdk_license = True
        android.archs = armeabi-v7a, arm64-v8a
        android.permissions = INTERNET, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE, MANAGE_EXTERNAL_STORAGE
        android.enable_androidx = True
        android.allow_backup = True
        android.debug = 0
        android.release = 1
        android.version_code = ${env:GITHUB_RUN_NUMBER}
        EOF

    - name: Restore Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

    - name: Build with Docker
      run: |
        docker run --rm \
          -v $(pwd):/app \
          -v ~/.buildozer:/home/user/.buildozer \
          -e KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
          -e KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
          -e KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
          kivy/buildozer \
          buildozer android debug deploy run

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PlanAndroid-v1.0.${{ github.run_number }}
        path: bin/*.apk
        retention-days: 30
        if-no-files-found: error
