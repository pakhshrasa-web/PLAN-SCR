name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential git zip unzip \
          autoconf libtool \
          pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev libtinfo5 cmake \
          libffi-dev libssl-dev wget \
          ccache \
          libfreetype6-dev libjpeg-dev zlib1g-dev \
          libsqlite3-dev

    - name: Install Python packages
      run: |
        pip install -q buildozer cython==0.29.37

    - name: Set GCC as default compiler
      run: |
        sudo apt-get install -y gcc g++
        echo "CC=gcc" >> $GITHUB_ENV
        echo "CXX=g++" >> $GITHUB_ENV
        echo "LD=g++" >> $GITHUB_ENV
        sudo ln -sf /usr/bin/gcc /usr/local/bin/cc
        sudo ln -sf /usr/bin/g++ /usr/local/bin/c++
        gcc --version

    - name: Clean ALL NDK versions
      run: |
        rm -rf ~/.buildozer/android/platform/android-ndk-*
        rm -rf .buildozer/android/platform/android-ndk-*

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Plan Android
        package.name = planandroid
        package.domain = org.pakhshrasa
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ttf,json
        version = 0.1.1
        
        # ✅ کتابخانه‌های کامل
        requirements = python3,kivy==2.3.0,openpyxl,arabic-reshaper,python-bidi,requests,Pillow,jdatetime,persiantools,pyjnius,android
        
        orientation = portrait
        fullscreen = 1
        android.add_src = fonts/
        
        # ✅ NDK نسخه پایدار
        p4a.ndk_version = 25b
        p4a.branch = master
        
        [buildozer]
        log_level = 2
        warn_on_root = 1
        
        [buildozer:android]
        android.sdk_path = /home/runner/.buildozer/android/platform/android-sdk
        android.api = 33
        android.minapi = 21
        android.ndk = 25b
        android.accept_sdk_license = True
        android.archs = armeabi-v7a, arm64-v8a
        
        # ✅ مجوزهای کامل
        android.permissions = INTERNET, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE, MANAGE_EXTERNAL_STORAGE, CAMERA, RECORD_AUDIO, ACCESS_FINE_LOCATION, ACCESS_COARSE_LOCATION
        
        android.enable_androidx = True
        android.allow_backup = True
        android.unsafe_ssl = False
        android.presplash_color = #FFFFFF
        android.ignore_manifest = False
        android.enable_on_back_invoked_callback = True
        android.version_code = 2
        android.debug = 0
        android.release = 1
        
        # ✅ تنظیمات keystore
        android.keystore = planandroid.keystore
        android.keystore_password = ${{ secrets.KEYSTORE_PASSWORD }}
        android.keystore_alias = ${{ secrets.KEY_ALIAS }}
        android.keystore_alias_password = ${{ secrets.KEY_PASSWORD }}
        EOF

    - name: Create initial json files
      run: |
        mkdir -p data
        # ... (بقیه فایل‌های JSON مثل قبل)

    - name: Copy fonts and data to build directory
      run: |
        mkdir -p .buildozer/android/app/fonts
        mkdir -p .buildozer/android/app/data
        cp -v fonts/*.ttf .buildozer/android/app/fonts/ 2>/dev/null || echo "No fonts"
        cp -v data/*.json .buildozer/android/app/data/ 2>/dev/null || echo "No data"

    - name: Update version and version_code
      run: |
        sed -i "s/android.version_code = [0-9]*/android.version_code = ${{ github.run_number }}/" buildozer.spec
        sed -i "s/version = .*/version = ${{ github.run_number }}/" buildozer.spec
        echo "Version set to: ${{ github.run_number }}"

    - name: Restore Keystore from Secrets
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
        mkdir -p .buildozer/android/platform/
        cp keystore.jks .buildozer/android/platform/planandroid.keystore
        echo "Keystore restored successfully"

    - name: Build with Buildozer
      run: |
        echo "y" | buildozer -v android release
      env:
        CC: gcc
        CXX: g++
        LD: g++
        # ✅ افزایش حافظه برای بیلد
        GRADLE_OPTS: "-Xmx2048m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
        JAVA_OPTS: "-Xmx2048m"

    - name: Convert AAB to Signed APK
      run: |
        AAB_FILE=$(find . -name "*.aab" -type f | head -n 1)
        if [ -f "$AAB_FILE" ]; then
          echo "Found AAB: $AAB_FILE"
          wget -q https://github.com/google/bundletool/releases/download/1.17.0/bundletool-all-1.17.0.jar -O bundletool.jar
          java -jar bundletool.jar build-apks \
            --bundle="$AAB_FILE" \
            --output=app.apks \
            --mode=universal \
            --ks=keystore.jks \
            --ks-pass=pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --ks-key-alias=${{ secrets.KEY_ALIAS }} \
            --key-pass=pass:${{ secrets.KEY_PASSWORD }} \
            --overwrite
          unzip -o app.apks -d apk_output
          mkdir -p bin
          cp apk_output/universal.apk bin/app-release.apk
          echo "APK created successfully"
        else
          echo "No AAB file found, checking for APK..."
          APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          if [ -f "$APK_FILE" ]; then
            mkdir -p bin
            cp "$APK_FILE" bin/app-release.apk
            echo "APK found and copied"
          else
            echo "No APK or AAB file found!"
            echo "Listing contents of bin directory:"
            ls -la bin/ || echo "No bin directory"
            echo "Listing contents of current directory:"
            ls -la
            exit 1
          fi
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
        retention-days: 30
        if-no-files-found: error
