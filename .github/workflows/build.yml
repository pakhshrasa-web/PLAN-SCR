name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.12'
    
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential git zip unzip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev wget ccache \
          gcc g++
    
    - name: Install buildozer
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer==1.5.0 cython==0.29.37
    
    - name: Clean ALL
      run: |
        rm -rf ~/.buildozer
        rm -rf .buildozer
        rm -rf bin
        rm -rf ~/.cache/pip
        mkdir -p data fonts
    
    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Plan Android
        package.name = planandroid
        package.domain = org.pakhshrasa
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ttf,json
        version = 0.1.1
        
        # بدون Pillow و freetype
        requirements = python3,kivy==2.3.0,openpyxl,arabic-reshaper,python-bidi,jdatetime
        
        orientation = portrait
        fullscreen = 1
        
        [buildozer]
        log_level = 2
        warn_on_root = 1
        
        [buildozer:android]
        android.api = 33
        android.minapi = 21
        android.accept_sdk_license = True
        android.archs = arm64-v8a
        android.permissions = INTERNET, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE
        android.enable_androidx = True
        android.allow_backup = True
        android.debug = 0
        android.release = 1
        
        p4a.branch = develop
        EOF
        
        echo "=== Spec created ==="
        cat buildozer.spec
    
    - name: Build APK
      run: |
        echo "=== Starting build ==="
        yes | buildozer -v android release 2>&1 | tee build.log
        echo "Build exit code: $?"
      env:
        CC: gcc
        CXX: g++
    
    - name: Find APK
      run: |
        echo "=== Searching for APK ==="
        find "$GITHUB_WORKSPACE" -name "*.apk" -type f -exec ls -la {} \; 2>/dev/null
        find "$HOME/.buildozer" -name "*.apk" -type f -exec ls -la {} \; 2>/dev/null
        find / -name "*.apk" -type f 2>/dev/null | head -10
    
    - name: Copy APK
      run: |
        mkdir -p apk_output
        APK=$(find "$GITHUB_WORKSPACE" "$HOME/.buildozer" -name "*.apk" -type f 2>/dev/null | head -1)
        
        if [ -n "$APK" ]; then
          cp "$APK" apk_output/
          echo "APK copied: $APK"
          echo "Size: $(du -h "$APK" | cut -f1)"
          ls -la apk_output/
        else
          echo "No APK found!"
          tail -100 build.log > apk_output/diagnostic.txt
          echo "Last 100 lines of log saved"
        fi
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: apk_output/*
        if-no-files-found: warn
    
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        if-no-files-found: warn
