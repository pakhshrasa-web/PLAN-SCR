name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.12'
    
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential git zip unzip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev wget ccache \
          libfreetype6-dev libjpeg-dev gcc g++ \
          libfreetype6 tree
    
    - name: Install p4a and cython
      run: |
        pip install --upgrade pip setuptools wheel
        pip install python-for-android cython==0.29.37
    
    - name: Clean ALL previous builds
      run: |
        rm -rf ~/.buildozer
        rm -rf ~/.local/share/python-for-android
        rm -rf .buildozer
        rm -rf bin
        rm -rf __pycache__
        mkdir -p data fonts
        echo "CC=gcc" >> $GITHUB_ENV
        echo "CXX=g++" >> $GITHUB_ENV
    
    - name: Download NDK r25b and SDK
      run: |
        echo "=== Downloading NDK r25b ==="
        mkdir -p ~/.android
        cd ~/.android
        
        wget -q --tries=5 --timeout=60 \
          "https://dl.google.com/android/repository/android-ndk-r25b-linux.zip" \
          -O ndk.zip
        
        unzip -q ndk.zip
        rm ndk.zip
        
        echo "=== Downloading Android SDK ==="
        mkdir -p ~/.android/sdk
        cd ~/.android/sdk
        
        wget -q --tries=5 --timeout=60 \
          "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" \
          -O cmdtools.zip
        
        unzip -q cmdtools.zip
        rm cmdtools.zip
        
        yes | ~/.android/sdk/cmdline-tools/bin/sdkmanager --licenses > /dev/null 2>&1 || true
        
        ~/.android/sdk/cmdline-tools/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2" > /dev/null 2>&1 || true
        
        echo "=== NDK and SDK ready ==="
        ls -la ~/.android/
        echo "NDK version:"
        cat ~/.android/android-ndk-r25b/source.properties | grep "Pkg.Revision"
    
    - name: Download freetype from multiple sources
      run: |
        echo "=== Downloading freetype ==="
        mkdir -p ~/.cache/p4a/freetype
        
        wget --tries=5 --timeout=60 \
          "https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz" \
          -O ~/.cache/p4a/freetype/freetype-2.14.1.tar.gz \
        || wget --tries=5 --timeout=60 \
          "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz" \
          -O ~/.cache/p4a/freetype/freetype-2.14.1.tar.gz \
        || wget --tries=5 --timeout=60 \
          "https://ftp.osuosl.org/pub/blfs/conglomeration/freetype/freetype-2.14.1.tar.gz" \
          -O ~/.cache/p4a/freetype/freetype-2.14.1.tar.gz
        
        echo "=== Freetype downloaded ==="
        ls -la ~/.cache/p4a/freetype/
        file ~/.cache/p4a/freetype/freetype-2.14.1.tar.gz
    
    - name: Build APK with p4a directly
      run: |
        echo "=== Starting p4a build ==="
        
        # ساخت APK
        p4a apk \
          --private "$GITHUB_WORKSPACE" \
          --package org.pakhshrasa.planandroid \
          --name "Plan Android" \
          --version 0.1.1 \
          --bootstrap sdl2 \
          --requirements "python3,kivy==2.3.0,Pillow==10.4.0,openpyxl,arabic-reshaper,python-bidi,jdatetime" \
          --arch arm64-v8a \
          --sdk-dir "$HOME/.android/sdk" \
          --ndk-dir "$HOME/.android/android-ndk-r25b" \
          --android-api 33 \
          --ndk-api 21 \
          --release \
          --copy-libs \
          2>&1 | tee build.log
        
        echo "=== Build completed ==="
        
        # جستجوی APK
        echo "=== Searching for APK files ==="
        find "$GITHUB_WORKSPACE" -name "*.apk" -type f 2>/dev/null || true
        find "$HOME" -maxdepth 4 -name "*.apk" -type f 2>/dev/null || true
        find "/tmp" -name "*.apk" -type f 2>/dev/null || true
        
        # نمایش ساختار دایرکتوری
        echo "=== Directory structure ==="
        ls -la "$GITHUB_WORKSPACE"
        find "$GITHUB_WORKSPACE" -maxdepth 3 -type d | head -20
      env:
        CC: gcc
        CXX: g++
        ANDROIDSDK: "$HOME/.android/sdk"
        ANDROIDNDK: "$HOME/.android/android-ndk-r25b"
        ANDROIDAPI: "33"
        ANDROIDMINAPI: "21"
    
    - name: Prepare APK for upload
      run: |
        echo "=== Finding and copying APK ==="
        mkdir -p apk_output
        
        # جستجوی APK در کل سیستم
        APK_FILES=$(find / -name "*.apk" -type f 2>/dev/null | head -10)
        
        if [ -n "$APK_FILES" ]; then
          echo "Found APK files:"
          echo "$APK_FILES"
          
          # کپی اولین APK
          FIRST_APK=$(echo "$APK_FILES" | head -1)
          cp "$FIRST_APK" apk_output/
          echo "APK copied to apk_output/"
          ls -la apk_output/
        else
          echo "No APK found! Creating dummy file..."
          echo "Build failed - check build.log" > apk_output/README.txt
        fi
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: apk_output/*
        if-no-files-found: warn
    
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        if-no-files-found: warn
