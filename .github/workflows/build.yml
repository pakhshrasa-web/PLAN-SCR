name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.12'
    
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential git zip unzip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev wget ccache \
          libfreetype6-dev libjpeg-dev gcc g++
    
    - name: Install buildozer
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer==1.5.0 cython==0.29.37
    
    - name: Clean ALL
      run: |
        rm -rf ~/.buildozer
        rm -rf .buildozer
        rm -rf bin
        rm -rf ~/.cache/pip
        mkdir -p data fonts
    
    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Plan Android
        package.name = planandroid
        package.domain = org.pakhshrasa
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ttf,json
        version = 0.1.1
        
        requirements = python3,kivy==2.3.0,Pillow==10.4.0,openpyxl,arabic-reshaper,python-bidi,jdatetime
        
        orientation = portrait
        fullscreen = 1
        
        [buildozer]
        log_level = 2
        warn_on_root = 1
        
        [buildozer:android]
        android.api = 33
        android.minapi = 21
        android.ndk = 25b
        android.accept_sdk_license = True
        android.archs = arm64-v8a
        android.permissions = INTERNET, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE
        android.enable_androidx = True
        android.allow_backup = True
        android.debug = 0
        android.release = 1
        
        p4a.branch = develop
        p4a.ndk_version = 25b
        EOF
        
        echo "=== Spec created ==="
    
    - name: Run buildozer init to create directories
      run: |
        echo "=== Initializing buildozer ==="
        yes | buildozer android debug 2>&1 | head -50 || true
        echo "=== Directories created ==="
        find ~/.buildozer -type d 2>/dev/null | head -20
        find .buildozer -type d 2>/dev/null | head -20
    
    - name: Download freetype to ALL possible locations
      run: |
        echo "=== Downloading freetype ==="
        
        # مسیرهای ممکن
        PATHS=(
          "$HOME/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype"
          "$HOME/.buildozer/android/platform/build-arm64-v8a/packages/freetype"
          "$GITHUB_WORKSPACE/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype"
          "$GITHUB_WORKSPACE/.buildozer/android/platform/build-arm64-v8a/packages/freetype"
        )
        
        # دانلود یکبار
        TMP_FILE="/tmp/freetype-2.14.1.tar.gz"
        wget --tries=5 --timeout=120 \
          "https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz" \
          -O "$TMP_FILE" \
        || wget --tries=5 --timeout=120 \
          "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz" \
          -O "$TMP_FILE" \
        || wget --tries=5 --timeout=120 \
          "https://ftp.osuosl.org/pub/blfs/conglomeration/freetype/freetype-2.14.1.tar.gz" \
          -O "$TMP_FILE"
        
        echo "=== Downloaded file size: $(du -h "$TMP_FILE" | cut -f1) ==="
        
        # کپی به همه مسیرها
        for path in "${PATHS[@]}"; do
          mkdir -p "$path"
          cp "$TMP_FILE" "$path/freetype-2.14.1.tar.gz"
          touch "$path/.mark-freetype-2.14.1.tar.gz"
          echo "Copied to: $path"
        done
        
        # نمایش فایل‌ها
        for path in "${PATHS[@]}"; do
          echo "=== $path ==="
          ls -la "$path/" 2>/dev/null || echo "Not found"
        done
    
    - name: Download NDK r25b to buildozer location
      run: |
        echo "=== Downloading NDK r25b ==="
        mkdir -p ~/.buildozer/android/platform
        
        wget --tries=5 --timeout=120 \
          "https://dl.google.com/android/repository/android-ndk-r25b-linux.zip" \
          -O /tmp/ndk.zip
        
        cd ~/.buildozer/android/platform
        unzip -q /tmp/ndk.zip
        rm /tmp/ndk.zip
        
        echo "=== NDK ready ==="
        ls -la ~/.buildozer/android/platform/ | grep ndk
    
    - name: Build APK
      run: |
        echo "=== Starting build ==="
        
        # حذف فایل mark اشتباه
        find ~/.buildozer -name ".mark-freetype*" -delete 2>/dev/null || true
        find .buildozer -name ".mark-freetype*" -delete 2>/dev/null || true
        
        # اجرای buildozer
        yes | buildozer -v android release 2>&1 | tee build.log
        
        echo "=== Build finished ==="
      env:
        CC: gcc
        CXX: g++
        ANDROIDAPI: "33"
        ANDROIDMINAPI: "21"
        P4A_NDK_VERSION: "25b"
    
    - name: Check APK
      run: |
        echo "=== Checking APK ==="
        find . -name "*.apk" -type f -exec ls -la {} \; 2>/dev/null
        find ~/.buildozer -name "*.apk" -type f -exec ls -la {} \; 2>/dev/null
        
        APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
        if [ -n "$APK" ]; then
          echo "=== APK: $APK ==="
          echo "Size: $(du -h "$APK" | cut -f1)"
          unzip -l "$APK" | head -30
        else
          echo "No APK found!"
        fi
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: |
          **/*.apk
          *.apk
        if-no-files-found: warn
    
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        if-no-files-found: warn
