name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential git zip unzip \
          autoconf libtool \
          pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev libtinfo5 cmake \
          libffi-dev libssl-dev wget \
          ccache \
          libfreetype6-dev libjpeg-dev zlib1g-dev

    - name: Install Python packages
      run: |
        pip install --upgrade pip==23.3.2
        pip install python-for-android==2023.9.16
        pip install cython==0.29.37
        pip install buildozer==1.5.0

    - name: Download and setup NDK 25b
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip
        mkdir -p /home/runner/.buildozer/android/platform/
        rm -rf /home/runner/.buildozer/android/platform/android-ndk-*
        mv android-ndk-r25b /home/runner/.buildozer/android/platform/
        echo "ANDROID_NDK_HOME=/home/runner/.buildozer/android/platform/android-ndk-r25b" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/home/runner/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV

    - name: Setup Android SDK with API 34
      run: |
        mkdir -p /home/runner/.buildozer/android/platform/
        cd /home/runner/.buildozer/android/platform/
        
        # دانلود command line tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-9477386_latest.zip
        
        # نصب SDK
        mkdir -p android-sdk/cmdline-tools
        mv cmdline-tools android-sdk/cmdline-tools/latest
        
        cd android-sdk/cmdline-tools/latest
        
        # پذیرش لایسنس‌ها
        yes | ./bin/sdkmanager --licenses > /dev/null 2>&1 || true
        
        # نصب API 34 و build-tools
        ./bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1
        
        echo "SDK installed successfully"
        ls -la /home/runner/.buildozer/android/platform/android-sdk/platforms/

    - name: Create data files
      run: |
        mkdir -p data
        echo '{"agents": [], "routes": [], "customers": []}' > data/definitions.json
        echo '{"supervision_rate": 0.3, "conversion_rate": 0.25, "avg_invoice_amount": 1000000, "target_amount": 50000000, "target_count": 100, "target_invoice_count": 20, "target_customer_count": 50, "target_new_customer_count": 10, "target_cash_sales": 30000000, "target_credit_sales": 20000000, "work_start_time": "08:00", "first_visit_time": "09:00", "min_daily_hours": 6, "first_customer_of_route": ""}' > data/settings.json
        echo '{"users": []}' > data/users.json
        echo '{"codes": []}' > data/codes.json
        echo '{"hashed_password": ""}' > data/admin_password.json
        echo '{}' > data/daily_log.json

    - name: Copy fonts and data
      run: |
        mkdir -p .buildozer/android/app/fonts
        mkdir -p .buildozer/android/app/data
        mkdir -p .buildozer/android/app/icon  
        cp -v fonts/*.ttf .buildozer/android/app/fonts/ 2>/dev/null || true
        cp -v data/*.json .buildozer/android/app/data/ 2>/dev/null || true
        cp -v icon/*.png .buildozer/android/app/icon/ 2>/dev/null || true

    - name: Restore Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
        mkdir -p .buildozer/android/platform/
        cp keystore.jks .buildozer/android/platform/planandroid.keystore

    - name: Build APK with p4a
      run: |
        p4a apk \
          --private . \
          --package=org.pakhshrasa.planandroid \
          --name="Plan Android" \
          --version=1.0.${{ github.run_number }} \
          --bootstrap=sdl2 \
          --requirements=python3,kivy,openpyxl,arabic-reshaper,python-bidi,requests,Pillow,jdatetime \
          --android-api=34 \
          --ndk-api=21 \
          --arch=arm64-v8a \
          --arch=armeabi-v7a \
          --permission=INTERNET \
          --permission=WRITE_EXTERNAL_STORAGE \
          --permission=READ_EXTERNAL_STORAGE \
          --permission=MANAGE_EXTERNAL_STORAGE \
          --enable-androidx \
          --allow-backup \
          --debug
      env:
        ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r25b
        ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

    - name: Find and rename APK
      run: |
        APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
        if [ -f "$APK_FILE" ]; then
          mkdir -p bin
          cp "$APK_FILE" bin/app-release.apk
          echo "APK found at: $APK_FILE"
        else
          echo "No APK found!"
          # نمایش فایل‌های موجود برای دیباگ
          find . -name "*.apk" -type f || true
          find . -name "*.aab" -type f || true
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PlanAndroid-v1.0.${{ github.run_number }}
        path: bin/*.apk
        retention-days: 30
        if-no-files-found: error
