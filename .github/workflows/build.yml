name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev
        pip install --upgrade pip==23.3.2
        pip install buildozer cython==0.29.37
        pip install python-for-android==2023.9.16

    - name: Set up Android NDK 25b
      run: |
        # دانلود و تنظیم NDK 25b
        wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip
        mkdir -p ~/.buildozer/android/platform
        mv android-ndk-r25b ~/.buildozer/android/platform/
        export ANDROID_NDK_HOME=~/.buildozer/android/platform/android-ndk-r25b
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = PlanAndroid
        package.name = planandroid
        package.domain = org.example
        
        # ⚠️ نسخه از GitHub Run Number گرفته می‌شود
        version = 1.0.${env:GITHUB_RUN_NUMBER}
        version.code = ${env:GITHUB_RUN_NUMBER}
        
        # ⚠️ بدون نسخه دقیق - برای سازگاری با اندروید
        requirements = python3,kivy,openpyxl,arabic-reshaper,python-bidi,requests,Pillow,jdatetime
        
        orientation = portrait
        fullscreen = 0
        
        # ⚠️ استفاده از NDK 25b
        android.api = 33
        android.ndk = 25b
        android.archs = armeabi-v7a, arm64-v8a
        android.enable_androidx = True
        android.gradle_dependencies = 'com.android.support:multidex:1.0.3'
        
        # ⚠️ پین کردن نسخه python-for-android
        android.p4a_version = 2023.9.16
        android.python3_version = 3.10
        
        # ⚠️ حذف pyjnius و کتابخانه‌های اضافی
        
        # FileProvider برای اندروید 7+
        android.extra_android_manifest = <provider android:name="androidx.core.content.FileProvider" android:authorities="${packageName}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths"/></provider>
        
        # Keystore برای امضای APK
        android.keystore = planandroid.keystore
        android.keystore_alias = planandroid
        android.keystore_password = ${env:KEYSTORE_PASSWORD}
        android.keyalias_password = ${env:KEYALIAS_PASSWORD}
        
        # دسترسی‌ها
        android.permissions = INTERNET, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE, MANAGE_EXTERNAL_STORAGE
        
        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: Create Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > planandroid.keystore

    - name: Build APK
      run: |
        # بیلد با NDK 25b
        buildozer android debug --ndk-version 25b

    - name: List built APK
      run: |
        find . -name "*.apk" -ls

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PlanAndroid-v1.0.${{ github.run_number }}
        path: |
          bin/*.apk
          !bin/*.aab

    - name: Get APK path
      id: apk_path
      run: |
        APK_FILE=$(find bin -name "*.apk" | head -1)
        echo "apk_file=$APK_FILE" >> $GITHUB_OUTPUT
        echo "APK found: $APK_FILE"

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      with:
        name: PlanAndroid v1.0.${{ github.run_number }}
        tag_name: v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          ${{ steps.apk_path.outputs.apk_file }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
