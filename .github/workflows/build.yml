name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.12'
    
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential \
          git \
          zip \
          unzip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          cmake \
          libffi-dev \
          libssl-dev \
          wget \
          ccache \
          libfreetype6-dev \
          libjpeg-dev \
          gcc \
          g++
    
    - name: Install buildozer and cython
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer==1.5.0 cython==0.29.37
    
    - name: Clean old NDK and build files
      run: |
        rm -rf ~/.buildozer/android/platform/android-ndk-*
        rm -rf .buildozer/android/platform/android-ndk-*
        rm -rf ~/.buildozer/android/platform/build-*
        rm -rf .buildozer/android/platform/build-*
        rm -rf ~/.cache/pip
        echo "CC=gcc" >> $GITHUB_ENV
        echo "CXX=g++" >> $GITHUB_ENV
    
    - name: Create data directory
      run: |
        mkdir -p data
        mkdir -p fonts
    
    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'SPECEOF'
        [app]
        title = Plan Android
        package.name = planandroid
        package.domain = org.pakhshrasa
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ttf,json
        version = 0.1.1
        
        requirements = python3,kivy==2.3.0,Pillow==10.4.0,openpyxl,arabic-reshaper,python-bidi,jdatetime
        
        orientation = portrait
        fullscreen = 1
        
        [buildozer]
        log_level = 2
        warn_on_root = 1
        
        [buildozer:android]
        android.sdk_path = /home/runner/.buildozer/android/platform/android-sdk
        android.ndk_path = /home/runner/.buildozer/android/platform/android-ndk-r25b
        android.api = 33
        android.minapi = 21
        android.ndk = 25b
        android.accept_sdk_license = True
        android.archs = arm64-v8a
        android.permissions = INTERNET, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE
        android.enable_androidx = True
        android.allow_backup = True
        android.debug = 0
        android.release = 1
        
        p4a.branch = develop
        p4a.ndk_version = 25b
        SPECEOF
    
    - name: Verify spec file
      run: |
        echo "=== buildozer.spec ==="
        cat buildozer.spec
        echo "=== Python version ==="
        python --version
        echo "=== Checking NDK path ==="
        ls -la ~/.buildozer/android/platform/ 2>/dev/null || echo "Directory not created yet"
    
    - name: Build APK
      run: |
        yes | buildozer -v android release 2>&1 | tee build.log
      env:
        CC: gcc
        CXX: g++
        P4A_NDK_VERSION: "25b"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: |
          bin/*.apk
          bin/*.aab
        if-no-files-found: warn
    
    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        if-no-files-found: warn
